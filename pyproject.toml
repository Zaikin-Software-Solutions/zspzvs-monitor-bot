[project]
name = "zspzvs-monitor-bot"
version = "1.1.0"
description = "Telegram bot для мониторинга zspzvs-инфраструктуры: проверяет хосты, ноды и сервисы, шлёт админу и в канал."
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.27,<4",
    "aiosqlite>=0.20",
    "httpx>=0.27",
    "asyncpg>=0.29",
    "python-dotenv>=1.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
]

[tool.ruff]
line-length = 100
target-version = "py312"
