# Production compose: pulls the prebuilt multi-arch image from GHCR.
# For local development with rebuild-on-change, use:
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
services:
  monitor-bot:
    image: ghcr.io/zaikin-software-solutions/zspzvs-monitor-bot:latest
    container_name: zspzvs-monitor-bot
    restart: always
    env_file:
      - .env
    volumes:
      - ./data:/data
    # Доступ к: prometheus (docker DNS), postgres remnawave, локальные docker.sock + systemctl
    # будут добавлены отдельно при деплое.
    networks:
      - monitoring

networks:
  monitoring:
    external: true
